# Open a PR when memvara/memvara's packaged skill moves. Does not push to main.
name: Skill sync

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [skill-changed]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch library skill
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/memvara/memvara.git /tmp/memvara
          src=/tmp/memvara/memvara/skills/memvara
          if [ ! -f "$src/SKILL.md" ]; then
            echo "library default branch has no packaged skill yet; skip"
            echo "changed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # CLAUDE.md is shared across every repo in plugin-repos.txt and nothing used to
          # carry it, so it was hand-copied and drifted -- a section written in one of them
          # reached none of the others. The canonical is `plugin-claude.md` in the library;
          # everything between the `local:` markers belongs to THIS repository and survives,
          # because two of its sections legitimately differ per repo.
          # Addressed from the clone root, not by walking up from $src. The first version
          # counted one `..` short, resolved to a path that does not exist, and took the
          # not-found branch below on every run since it shipped.
          python3 - /tmp/memvara/plugin-claude.md <<'COMPOSE'
          import pathlib, sys
          BEGIN = "<!-- local: begin — this repository's own facts; skill-sync preserves this block -->"
          END = "<!-- local: end -->"
          canonical = pathlib.Path(sys.argv[1])
          if not canonical.is_file():
              # Loud. This exact branch ran on every sync from the day it shipped, printed
              # its honest line into a log nobody reads, and let the job go green while
              # CLAUDE.md was never composed at all. The canonical exists; not finding it
              # can only mean the clone or the path is wrong, and neither is a reason to
              # report success.
              raise SystemExit(f"canonical not found at {canonical} -- "
                               "the library clone or this path is wrong")
          here = pathlib.Path("CLAUDE.md")
          text = here.read_text(encoding="utf-8")
          if BEGIN not in text or END not in text:
              # Refuse rather than guess: splicing without both markers replaces this
              # repository's own sections with the canonical's placeholder and loses them.
              # Also loud, for the same reason. Every one of these repositories has the
              # markers and a test that requires exactly one pair, so their absence is a
              # broken checkout rather than a repository that opted out.
              raise SystemExit("CLAUDE.md has no local block; refusing to splice")
          local = text[text.index(BEGIN) + len(BEGIN):text.index(END)]
          out = canonical.read_text(encoding="utf-8").replace(
              "@@LOCAL@@\n", BEGIN + local + END + "\n", 1)
          here.write_text(out, encoding="utf-8")
          print("CLAUDE.md composed from the canonical, local block preserved")
          COMPOSE

          rm -rf plugin/skills/memvara
          mkdir -p plugin/skills
          cp -R "$src" plugin/skills/memvara
          sha=$(git -C /tmp/memvara rev-parse HEAD)
          python3 -c "
          from pathlib import Path
          Path('skill.lock').write_text(
              '# The library commit whose memvara/skills/memvara/ tree this plugin vendors.\\n'
              '# CI diffs plugin/skills/memvara against that SHA. skill-sync.yml updates this\\n'
              '# file when it opens a PR.\\n'
              'repo=memvara/memvara\\n'
              f'sha=$sha\\n'
              'path=memvara/skills/memvara\\n'
          )
          "
          if git diff --quiet -- plugin/skills/memvara skill.lock CLAUDE.md; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            echo "changed=true" >> "$GITHUB_ENV"
            echo "sha=$sha" >> "$GITHUB_ENV"
          fi

      - name: Open PR
        if: env.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT when the org has provisioned one, GITHUB_TOKEN otherwise.
          #
          # The default is GITHUB_TOKEN, and on this org GITHUB_TOKEN cannot open a pull
          # request: every repository is pinned to read-only workflow permissions with
          # "Allow GitHub Actions to create and approve pull requests" off, which is why
          # that box is greyed out in repository settings rather than merely unticked.
          # Every scheduled run since this workflow was added fetched the skill correctly
          # and then died on this step with "GitHub Actions is not permitted to create or
          # approve pull requests", which is why the vendored skill sat five commits
          # behind while nothing went red.
          #
          # A PAT is not GITHUB_TOKEN, so it is not subject to that ceiling. Falls back so
          # the workflow keeps working unchanged wherever the policy does allow it.
          token: ${{ secrets.PLUGIN_SYNC_TOKEN || github.token }}
          commit-message: "chore: sync skill from memvara/memvara@${{ env.sha }}"
          title: "chore: sync skill from memvara/memvara@${{ env.sha }}"
          body: |
            Vendored skill drifted from [memvara/memvara](https://github.com/memvara/memvara) `${{ env.sha }}`.
            This PR only copies `memvara/skills/memvara/` and updates `skill.lock`.
            CI still has to pass before merge.
          branch: sync/skill-${{ env.sha }}
          delete-branch: true
