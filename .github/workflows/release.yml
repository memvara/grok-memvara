# CD for a git marketplace: a tag is what installers can pin. CI must pass first.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches plugin.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json; print(json.load(open('plugin/plugin.json'))['version'])")
          test "$tag" = "$ver"

      - name: Zip plugin
        run: zip -r plugin.zip plugin README.md LICENSE skill.lock

      - uses: softprops/action-gh-release@v2
        with:
          files: plugin.zip
          generate_release_notes: true
